<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI/UX Design Handoff Checklist | Kiran Mamadapur</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#20231f;font:15px/1.6 Arial,sans-serif}.wrap{max-width:900px;margin:48px auto;padding:0 22px}.sheet{background:#fffefa;border:1px solid #deddd5;padding:clamp(22px,5vw,48px)}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1.5px;margin:0 0 8px}.sub{color:#77786f;margin:0 0 28px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field textarea,.meta input{width:100%;border:1px solid #c9c8bf;background:#fffefa;padding:12px;font:inherit;min-height:85px}.meta input{min-height:44px}.actions{display:flex;gap:10px;margin:20px 0}.actions button{padding:11px 16px;border:1px solid #20231f;background:#20231f;color:white;cursor:pointer}@media print{body{background:white}.wrap{margin:0;max-width:none;padding:0}.sheet{border:0}.actions{display:none}.field textarea,.meta input{border:0;border-bottom:1px solid #bbb;resize:none}}</style></head><body><main class="wrap"><div class="sheet"><h1>UI/UX Design Handoff Checklist</h1><p class="sub">Editable starter template · Complete with project-specific evidence; do not treat assumptions as research findings.</p><div class="meta"><input aria-label="Project name" placeholder="Project name"><input aria-label="Date and version" placeholder="Date / version"><input aria-label="Prepared by" placeholder="Prepared by"><input aria-label="Status" placeholder="Status"></div><div class="field"><label for="f0">1. Page / component name</label><textarea id="f0" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f1">2. Figma frame and link</label><textarea id="f1" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f2">3. Viewport and responsive behaviour</label><textarea id="f2" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f3">4. Component states (default, hover, focus, error, disabled)</label><textarea id="f3" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f4">5. Spacing, typography and colour tokens</label><textarea id="f4" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f5">6. Interaction and validation rules</label><textarea id="f5" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f6">7. Accessibility notes</label><textarea id="f6" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f7">8. Assets and export specifications</label><textarea id="f7" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="field"><label for="f8">9. Acceptance criteria and owner</label><textarea id="f8" placeholder="Add notes, evidence and decisions..."></textarea></div><div class="actions"><button onclick="window.print()">Print / Save as PDF</button><button onclick="document.querySelectorAll('textarea,input').forEach(x=>x.value='')">Clear form</button></div></div></main></body></html>
