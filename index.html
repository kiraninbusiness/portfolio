<div><b>THE OFF GRID · Founder, Designer, Builder</b><br><span style="color:var(--mute)">2026 · Current</span><p style="margin:8px 0 0">Own the product end to end: brand system, e-commerce requirements, UX design and the build of the store.</p></div>
<div><b>Girias Investment Pvt. Ltd. · Intern</b><br><span style="color:var(--mute)">CRM workflow analysis</span><p style="margin:8px 0 0">Analysed CRM workflows, captured requirements and helped improve the process. Result: 24% efficiency improvement.</p></div></div></div></section>
<section class="s" id="projects" aria-labelledby="pj"><div class="w"><div class="eyebrow">Flagship project</div><h2 class="t" id="pj">THE OFF GRID: my real product.</h2>
<div class="feat card"><div>${cvw(f,"feat")}</div><div class="bd"><span class="chip r">Real product work</span><span class="chip">Flagship</span><h3 style="font-size:30px">${f.n}</h3><p style="color:var(--mute)">${f.ov}</p><div style="margin-bottom:16px">${["React / Vite","Node.js / Express","PostgreSQL","Vercel + Render","Admin 2FA","PWA"].map(x=>`<span class="chip">${x}</span>`).join("")}</div><div class="row"><a class="btn p" href="#case-${f.id}">View Case Study →</a>${lk(f,1)}</div></div></div>
<h3 style="margin-top:48px">Concept case studies</h3><p class="note" style="margin:0 0 18px">Independent projects that show my BA and UI/UX method. The clients and data are fictional.</p>
<div class="grid">${P.slice(1).map(p=>`<article class="card">${cvw(p)}<div class="bd">${chips(p)}<h3>${p.n}</h3><p>${p.t}. ${p.ov}</p><a class="go" href="#case-${p.id}" aria-label="View case study: ${p.n}">View Case Study →</a></div></article>`).join("")}</div></div></section>
<section class="s" id="skills" aria-labelledby="sk"><div class="w"><div class="eyebrow">Skills</div><h2 class="t" id="sk">Tools that turn ideas into impact.</h2><div class="sk">${SK.map(s=>`<div class="card"><h3>${s[0]}</h3><div>${s[1].split(",").map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>`).join("")}</div></div></section>
<section class="s" id="credentials" aria-labelledby="cr"><div class="w"><div class="eyebrow">Education and certifications</div><h2 class="t" id="cr">Proof behind the work.</h2><div class="cr">
<div class="card"><b>MBA, IT & Marketing</b><p>81%</p></div><div class="card"><b>BBA</b><p>Above 80%</p></div><div class="card"><b>IBM Certified Business Analyst</b><p>Requirements and process foundations</p></div><div class="card"><b>Deloitte Australia</b><p>Data Analytics Job Simulation</p></div><div class="card"><b>McKinsey Forward Program</b><p>Problem solving and business skills</p></div></div></div></section>
<section class="s" id="contact" aria-labelledby="ct"><div class="w"><div class="cta"><h2 class="t" id="ct">Let's work together.</h2><p>I'm open to:</p><div style="margin-bottom:22px">${["Business Analyst","Associate Business Analyst","Junior Business Analyst","Product Analyst","UI/UX Designer","Product / Project roles"].map(x=>`<span class="chip" style="color:var(--ink)">${x}</span>`).join("")}</div><div class="row" style="justify-content:center"><a class="btn p" data-cv style="background:#fff;color:var(--p)" href="${CV}">Download Resume</a><a class="btn" style="background:transparent;color:#fff" href="${LI}">LinkedIn ↗</a><a class="btn" style="background:transparent;color:#fff" href="${MAIL}">✉ Email me</a></div></div></div></section>`}
function gwt(a){const m=a.match(/^Given (.*?)(?:, when (.*?))?, then (.*)$/);return m?`<b>Given</b> ${m[1]}${m[2]?`<br><b>When</b> ${m[2]}`:""}<br><b>Then</b> ${m[3]}`:a}
function sitemap(p){const[a,b]=p.c;let s=`<svg viewBox="0 0 360 112" role="img" aria-label="${p.n} sitemap" style="max-width:420px;width:100%;height:auto"><rect x="130" y="4" width="100" height="28" rx="8" fill="${a}"/><text x="180" y="22" text-anchor="middle" font-size="11" fill="#fff" font-family="IBM Plex Sans,sans-serif">Home</text>`;
p.sr.forEach((n,i)=>{const x=10+i*118;s+=`<path d="M180 32 V50 H${x+50} V68" fill="none" stroke="${b}" stroke-width="1.5"/><rect x="${x}" y="68" width="100" height="34" rx="8" fill="#fff" stroke="${b}"/><text x="${x+50}" y="89" text-anchor="middle" font-size="9.5" fill="#14172b" font-family="IBM Plex Sans,sans-serif">${n}</text>`});return s+"</svg>"}
function cs(id){const x=P.findIndex(p=>p.id==id),p=P[x],pv=P[(x+P.length-1)%P.length],nx=P[(x+1)%P.length],S=[],add=(t,h)=>S.push([t,h]);
const sp=a=>a.split("|"),pr=["Must Have","Must Have","Should Have","Could Have"],pt=[5,5,3,8];
const real=p.real,lab=real?"This is my own product work.":"This is an independent concept project created to demonstrate BA and UI/UX method. The client, users and data are fictional.";
add("Project overview",tbl(["Item","Detail"],[["Client / product",p.n],["Project type",p.m[4]],["My role",p.m[0]],["Duration",p.m[1]],["Team",p.m[2]],["Tools",p.m[3]]])+`<p style="margin-top:12px">${p.ov}</p><p class="note">${lab}</p>`);
if(real)add("Product features and process",`<p><b>Process:</b></p><div class="row" style="margin-bottom:12px">${["Research","Requirements","User flow","Wireframes","UI","Development","Testing"].map((x,i)=>`<span class="chip">${i+1}. ${x}</span>`).join("")}</div><p><b>Product features:</b></p>${ul(p.ft)}`);
add("Business problem",`<p>${p.pr}</p>`);
add("Business objectives",ul(p.ob));
add("Stakeholders",tbl(["Stakeholder","Interest"],p.st.map(sp)));
add("BRD summary",tbl(["Section","Content"],[["Background",p.ov],["Problem statement",p.pr],["Business objectives",ul(p.ob)],["Scope",p.sc[0].replace("In: ","")],["Out of scope",p.sc[1].replace("Out: ","")],["Current-state process",p.cur],["Future-state process",p.fut],["Business rules",ul(p.br)],["Assumptions",ul(p.as)],["Constraints",ul(p.co)],["Risks and mitigation",ul(p.rk.map(r=>r.replace("|"," — ")))],["Success metrics",ul(p.kp.map(k=>{k=sp(k);return k[0]}))]]));
add("Functional requirements (FRD)",tbl(["ID","Requirement","Priority","Story"],p.fr.map((f,i)=>["FR-0"+(i+1),f,pr[i],"US-0"+(i%3+1)])));
add("Non-functional requirements",ul([...CN,...p.nf]));
add("User personas",`<div class="cols">${p.pe.map(q=>{q=sp(q);return`<div class="mini"><b>${q[0]}</b>${q[1]}<br>Goal: ${q[2]}<br>Pain: ${q[3]}</div>`}).join("")}</div>`);
add("UX process evidence",tbl(["Stage","Artifact","Evidence"],[["Discovery","User problem",p.pe.map(q=>sp(q)[3]).join("; ")],["Information architecture","Sitemap","See below"],["User flow","Process","See process flow"],["Wireframes","Low fidelity",p.sr.join(", ")],["UI","High fidelity",p.sr.join(", ")],["Prototype","Interaction",p.it.join("; ")],["Usability","Test plan","5 participants, 3 tasks each. Findings will be added after testing."]])+`<div style="margin-top:14px">${sitemap(p)}</div>`);
add("User journey",`<div class="cols">${p.jo.map((j,i)=>{j=sp(j);return`<div class="mini"><b>${i+1}. ${j[0]}</b>${j[1]}</div>`}).join("")}</div>`);
add("Process flow (BPMN style)",`<div class="scroll">${flow(p)}</div><p class="note">Current state: ${p.cur}</p>`);
add("Wireframes (low fidelity)",`<div class="frames">${p.sr.map((s,i)=>`<figure>${wire(p,i,0)}<figcaption>${s}</figcaption></figure>`).join("")}</div>`);
add("High-fidelity UI",`<div class="frames">${p.sr.map((s,i)=>`<figure>${wire(p,i,1)}<figcaption>${s}</figcaption></figure>`).join("")}</div><p class="note">Schematic screen designs, not final screenshots.</p>`);
add("User stories and acceptance criteria",`<div class="cols">${p.us.map((u,i)=>{u=sp(u);return`<div class="mini"><b>US-0${i+1}</b>As a ${u[0]}, I want to ${u[1]}, so that ${u[2]}.<hr style="border:0;border-top:1px solid var(--line)">${gwt(p.ac[i])}</div>`}).join("")}</div>`);
add("Jira-style backlog",`<div class="row" style="margin-bottom:10px">${["To Do","In Progress","In Review","Done"].map(x=>`<span class="chip">${x}</span>`).join("")}</div>`+tbl(["Key","Type","Summary","Priority","Pts","Sprint","Status"],[[`<span class="key">${p.pre}-100</span>`,"Epic",p.n+" release 1","High","–","–","To Do"],...p.fr.map((f,i)=>[`<span class="key">${p.pre}-10${i+1}</span>`,"Story",f,`<span class="pri p${i}">${["High","High","Medium","Low"][i]}</span>`,pt[i],"Sprint "+(i<2?1:2),"To Do"])])+`<p class="note">Illustrative backlog. Acceptance criteria are in the user stories.</p>`);
add("Requirements traceability matrix (RTM)",tbl(["Req ID","Requirement","Objective","Story","UI screen","Jira","Test case","Status"],p.fr.map((f,i)=>["FR-0"+(i+1),f,"BO-0"+(i%p.ob.length+1),"US-0"+(i%3+1),p.sr[i%3],`<span class="key">${p.pre}-10${i+1}</span>`,"UAT-0"+(i%3+1),"Specified, UAT planned"])));
add("UAT scenarios",tbl(["ID","Req","Scenario","Preconditions","Steps","Expected result","Actual","Status"],p.ua.map((u,i)=>{u=sp(u);const g=gw3(p.ac[i]);return["UAT-0"+(i+1),"FR-0"+(i+1),u[0],g[0],g[1]||u[0],g[2],"Not run","Planned"]}))+`<p class="note">No test has been executed yet, so no result is claimed.</p>`);
add("Data analysis and KPIs",tbl(["KPI","Definition","Baseline",real?"Plan":"Target"],p.kp.map((k,i)=>{k=sp(k);return[k[0],p.kd[i],k[1]||"–",k[2]]}))+bars(p)+`<p class="note">${real?"These are planned measures. Values will be added after launch.":"Baselines and targets are assumed for this concept project."}</p>`);
add("Results and expected outcomes",`<p><b>${real?"Result":"Target outcome (not a measured result)"}:</b> ${p.oc.replace("Expected result: ","")}</p>`);
const GR={"Project overview":0,"Product features and process":0,"Business problem":0,"Business objectives":0,"Stakeholders":0,"User personas":0,"UX process evidence":0,"User journey":0,"BRD summary":1,"Functional requirements (FRD)":1,"Non-functional requirements":1,"User stories and acceptance criteria":1,"Jira-style backlog":1,"Process flow (BPMN style)":2,"Wireframes (low fidelity)":2,"High-fidelity UI":2,"Requirements traceability matrix (RTM)":3,"UAT scenarios":3,"Data analysis and KPIs":3,"Results and expected outcomes":3},GN=["Discover","Define","Design","Validate"];
S.sort((x,y)=>GR[x[0]]-GR[y[0]]);let lg=-1,lt=-1;
const toc=S.map((q,i)=>{const g=GR[q[0]];let h="";if(g!=lt){lt=g;h=`<div class="tg">${GN[g]}</div>`}return h+`<button data-t="${i}">${i+1}. ${q[0]}</button>`}).join("");
const body=S.map((q,i)=>{const g=GR[q[0]];let h="";if(g!=lg){lg=g;h=`<div class="gh">0${g+1} ${GN[g]}</div>`}return h+`<section class="cs" id="s${i}" aria-labelledby="h${i}"><h2 id="h${i}"><i>${String(i+1).padStart(2,"0")}</i>${q[0]}</h2>${q[1]}</section>`}).join("");
return `<div class="w"><div class="crumb"><a class="btn" href="#projects">← Back to Projects</a><button class="btn noprint" onclick="print()">Save as PDF</button></div>
<div class="chead"><div>${chips(p)}${real?'<span class="chip">Flagship</span>':""}<h1 style="font-size:clamp(32px,5vw,52px)">${p.n}</h1><p style="color:var(--mute);font-size:19px">${p.t}</p><div class="row" style="margin-top:12px">${lk(p)}</div></div>${cvw(p,"hd")}</div>
<div class="glance">${[["Role",p.m[0]],["Duration",p.m[1]],["Type",p.m[4]],["Tools",p.m[3]]].map(g=>`<div><small>${g[0]}</small>${g[1]}</div>`).join("")}</div>${shots(p)}
<div class="lay"><nav class="toc" aria-label="Contents">${toc}</nav><div>${body}</div></div>
<div class="pn"><a class="btn" href="#case-${pv.id}">← ${pv.n}</a><a class="btn p" href="#case-${nx.id}">${nx.n} →</a></div></div>`}
const app=document.getElementById("app");
function route(){const h=location.hash.slice(1),m=h.match(/^case-(\w+)$/);document.getElementById("nav").classList.remove("on");
if(m&&P.some(p=>p.id==m[1])){const p=P.find(p=>p.id==m[1]);app.innerHTML=cs(m[1]);document.title=p.n+" case study | Kiran Mamadapur";scrollTo(0,0);
const h1=app.querySelector("h1");h1.tabIndex=-1;h1.focus({preventScroll:true});app.querySelectorAll(".toc button").forEach(b=>b.onclick=()=>document.getElementById("s"+b.dataset.t).scrollIntoView({behavior:"smooth"}))}
else{if(!app.querySelector("#about")){app.innerHTML=home();document.title="Kiran Mamadapur | Business Analyst & UI/UX Designer"}
const e=h&&document.getElementById(h);setTimeout(()=>e?e.scrollIntoView({behavior:"smooth"}):scrollTo(0,0),30)}}
let cvOk=1;function cv(){if(!cvOk)document.querySelectorAll("[data-cv]").forEach(a=>a.style.display="none")}
const _r=route;route=function(){_r();cv()};
addEventListener("hashchange",route);route();
if(location.protocol.startsWith("http"))fetch(CV,{method:"HEAD"}).then(r=>{if(!r.ok){cvOk=0;cv()}}).catch(()=>{});
document.querySelectorAll("#nav a").forEach(a=>a.addEventListener("click",()=>document.getElementById("nav").classList.remove("on")));
const mb=document.getElementById("mb");mb.onclick=()=>{const o=document.getElementById("nav").classList.toggle("on");mb.setAttribute("aria-expanded",o)};
</script>
